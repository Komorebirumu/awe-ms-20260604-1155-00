            generatedPlan += `- Fitness Level: ${currentFitness}\n`;
            generatedPlan += `- Sport: ${sport}\n`;
            generatedPlan += `- Recovery Phase: ${recoveryPhase}\n\n`;

            generatedPlan += `Here is a sample phase-appropriate routine. **Always consult with a medical professional or physical therapist before starting any new exercise program.**\n\n`;

            // Phase-specific recommendations (simplified)
            if (recoveryPhase.includes("Acute")) {
                generatedPlan += `### Acute Phase Recommendations:\n`;
                generatedPlan += `- Focus: Pain and inflammation reduction. Gentle RICE (Rest, Ice, Compression, Elevation) protocols.\n`;
                generatedPlan += `- Mobility: Very gentle, pain-free range of motion exercises (e.g., ankle pumps if lower body, pendulum swings if shoulder). Avoid any stressing the injured area.\n`;
                generatedPlan += `- Strengthening: None. Focus on surrounding, uninjured areas if pain allows.\n`;
                generatedPlan += `- Other: Manual therapy may be beneficial. Pain management is key.\n`;
            } else if (recoveryPhase.includes("Subacute")) {
                generatedPlan += `### Subacute Phase Recommendations:\n`;
                generatedPlan += `- Focus: Gradual restoration of pain-free range of motion and light activation.\n`;
                generatedPlan += `- Mobility: Active-assisted and active range of motion exercises. Stretching within pain-free limits.\n`;
                generatedPlan += `- Strengthening: Isometrics and very light resistance band exercises targeting the injured area and surrounding muscles. Focus on proper form and control.\n`;
                generatedPlan += `- Proprioception: Basic balance exercises if appropriate for the injury (e.g., single leg stance with support).\n`;
            } else if (recoveryPhase.includes("Remodeling/Strengthening")) {
                generatedPlan += `### Remodeling/Strengthening Phase Recommendations:\n`;
                generatedPlan += `- Focus: Progressive overload to rebuild strength, endurance, and neuromuscular control.\n`;
                generatedPlan += `- Mobility: Full range of motion exercises and dynamic stretching.\n`;
                generatedPlan += `- Strengthening: Introduce progressive resistance exercises (weights, machines, bands) for injured and supporting muscles. Focus on functional movements relevant to your sport.\n`;

                generatedPlan += `- Sport-Specific Drills: Gradual reintroduction of sport-specific movements (e.g., cutting, jumping, throwing) at reduced intensity and volume, progressing as tolerated.\n`;

                generatedPlan += `- Conditioning: High-intensity interval training (HIIT) and sport-specific endurance drills.\n`;
